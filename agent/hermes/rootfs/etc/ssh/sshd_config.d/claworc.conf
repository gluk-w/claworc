# Claworc SSH Server Hardened Configuration
# Applied via the sshd_config.d/ include mechanism. SSH is the contract's
# only hard runtime dependency — the control plane execs the shim verbs,
# streams files, and opens tunnels over this connection.

# Network
Port 22
ListenAddress 0.0.0.0

# Authentication
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password
MaxAuthTries 3
StrictModes yes
LoginGraceTime 30

# Connection limits
MaxStartups 10:30:60

# Forwarding restrictions
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding yes
# 127.0.0.1:40001 is the Claworc LLM proxy listener: the control plane
# installs a remote port forward on it so the agent's LLM traffic (routed
# there by configure-llm) reaches the gateway with virtual-key auth.
PermitListen 127.0.0.1:40001

# Logging
SyslogFacility AUTH
LogLevel INFO
